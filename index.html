<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperature Converter — Instrument Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10151b;
    --panel: #1a2129;
    --panel-2: #202932;
    --border: #2a333d;
    --border-strong: #3a4552;
    --text-primary: #eef2f5;
    --text-secondary: #8a97a3;
    --text-muted: #5c6772;
    --cold: #4fa3d1;
    --hot: #e2683f;
    --danger: #d1494f;
    --danger-bg: #2a1a1c;
    --danger-border: #5a2a2e;
    --radius: 10px;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--sans);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }

  .wrap{
    width: 100%;
    max-width: 720px;
  }

  .eyebrow{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 8px;
  }

  h1{
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .sub{
    color: var(--text-secondary);
    font-size: 14px;
    margin: 0 0 32px;
  }

  .panel{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 32px;
  }

  @media (max-width: 560px){
    .panel{ grid-template-columns: 1fr; }
    .gauge-col{ display: flex; justify-content: center; }
  }

  .gauge-col{
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .gauge-label{
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    margin-top: 10px;
    text-align: center;
  }

  .field{
    margin-bottom: 20px;
  }

  label{
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }

  input[type="text"]{
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 500;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input[type="text"]:focus{
    border-color: var(--cold);
  }

  input[type="text"].has-error{
    border-color: var(--danger);
  }

  .unit-row{
    display: flex;
    gap: 8px;
  }

  .unit-option{
    flex: 1;
  }

  .unit-option input{
    display: none;
  }

  .unit-option span{
    display: block;
    text-align: center;
    padding: 10px 8px;
    border-radius: var(--radius);
    border: 1px solid var(--border-strong);
    background: var(--panel-2);
    color: var(--text-secondary);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }

  .unit-option input:checked + span{
    border-color: var(--cold);
    color: var(--text-primary);
    background: rgba(79, 163, 209, 0.12);
  }

  .unit-option span:hover{
    border-color: var(--border-strong);
    color: var(--text-primary);
  }

  button{
    width: 100%;
    background: var(--hot);
    color: #1a0f08;
    border: none;
    border-radius: var(--radius);
    padding: 13px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
  }

  button:hover{ filter: brightness(1.08); }
  button:active{ transform: scale(0.99); }

  .error-msg{
    display: none;
    font-family: var(--mono);
    font-size: 12.5px;
    color: #f0a0a4;
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-top: -8px;
    margin-bottom: 20px;
  }

  .error-msg.show{ display: block; }

  .results{
    margin-top: 8px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  @media (max-width: 460px){
    .results{ grid-template-columns: 1fr; }
  }

  .result-card{
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 12px;
    text-align: center;
    transition: border-color 0.2s ease;
  }

  .result-card.active{
    border-color: var(--cold);
  }

  .result-card .rlabel{
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .result-card .rvalue{
    font-family: var(--mono);
    font-size: 19px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .result-card .rvalue.empty{
    color: var(--text-muted);
    font-weight: 400;
  }

  footer{
    text-align: center;
    margin-top: 24px;
    font-size: 12px;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">Instrument panel // conversion</p>
  <h1>Temperature converter</h1>
  <p class="sub">Enter a value, pick its unit, and read the equivalents across the scale.</p>

  <div class="panel">
    <div class="gauge-col">
      <svg id="thermo" width="56" height="220" viewBox="0 0 56 220" aria-hidden="true">
        <rect x="22" y="8" width="12" height="160" rx="6" fill="#242e38" stroke="#3a4552" stroke-width="1"/>
        <circle cx="28" cy="188" r="18" fill="#242e38" stroke="#3a4552" stroke-width="1"/>
        <rect id="mercuryCol" x="24" y="150" width="8" height="18" rx="4" fill="#4fa3d1"/>
        <circle id="mercuryBulb" cx="28" cy="188" r="13" fill="#4fa3d1"/>
        <line x1="36" y1="20" x2="41" y2="20" stroke="#5c6772" stroke-width="1"/>
        <line x1="36" y1="60" x2="41" y2="60" stroke="#5c6772" stroke-width="1"/>
        <line x1="36" y1="100" x2="41" y2="100" stroke="#5c6772" stroke-width="1"/>
        <line x1="36" y1="140" x2="41" y2="140" stroke="#5c6772" stroke-width="1"/>
      </svg>
      <p class="gauge-label" id="gaugeLabel">— °C</p>
    </div>

    <div>
      <div class="field">
        <label for="tempInput">Temperature value</label>
        <input type="text" id="tempInput" inputmode="decimal" placeholder="e.g. 25" autocomplete="off">
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <div class="field">
        <label>Input unit</label>
        <div class="unit-row">
          <label class="unit-option">
            <input type="radio" name="unit" value="C" checked>
            <span>Celsius</span>
          </label>
          <label class="unit-option">
            <input type="radio" name="unit" value="F">
            <span>Fahrenheit</span>
          </label>
          <label class="unit-option">
            <input type="radio" name="unit" value="K">
            <span>Kelvin</span>
          </label>
        </div>
      </div>

      <button id="convertBtn">Convert</button>

      <div class="results">
        <div class="result-card" id="cardC">
          <div class="rlabel">Celsius</div>
          <div class="rvalue empty" id="valC">—</div>
        </div>
        <div class="result-card" id="cardF">
          <div class="rlabel">Fahrenheit</div>
          <div class="rvalue empty" id="valF">—</div>
        </div>
        <div class="result-card" id="cardK">
          <div class="rlabel">Kelvin</div>
          <div class="rvalue empty" id="valK">—</div>
        </div>
      </div>
    </div>
  </div>

  <footer>Absolute zero: −273.15 °C · −459.67 °F · 0 K</footer>
</div>

<script>
  const tempInput = document.getElementById('tempInput');
  const errorMsg = document.getElementById('errorMsg');
  const convertBtn = document.getElementById('convertBtn');
  const valC = document.getElementById('valC');
  const valF = document.getElementById('valF');
  const valK = document.getElementById('valK');
  const cardC = document.getElementById('cardC');
  const cardF = document.getElementById('cardF');
  const cardK = document.getElementById('cardK');
  const mercuryCol = document.getElementById('mercuryCol');
  const mercuryBulb = document.getElementById('mercuryBulb');
  const gaugeLabel = document.getElementById('gaugeLabel');

  const ABS_ZERO_C = -273.15;
  const ABS_ZERO_F = -459.67;
  const ABS_ZERO_K = 0;

  function showError(msg){
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
    tempInput.classList.add('has-error');
    clearResults();
  }

  function hideError(){
    errorMsg.classList.remove('show');
    errorMsg.textContent = '';
    tempInput.classList.remove('has-error');
  }

  function clearResults(){
    [valC, valF, valK].forEach(el => {
      el.textContent = '—';
      el.classList.add('empty');
    });
    [cardC, cardF, cardK].forEach(c => c.classList.remove('active'));
    setThermometer(null);
  }

  function toCelsius(value, unit){
    if (unit === 'C') return value;
    if (unit === 'F') return (value - 32) * 5 / 9;
    if (unit === 'K') return value - 273.15;
  }

  function fromCelsius(c){
    return {
      c: c,
      f: c * 9 / 5 + 32,
      k: c + 273.15
    };
  }

  function fmt(n){
    const rounded = Math.round(n * 100) / 100;
    return rounded.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
  }

  function setThermometer(celsius){
    if (celsius === null){
      mercuryCol.setAttribute('fill', '#4fa3d1');
      mercuryBulb.setAttribute('fill', '#4fa3d1');
      mercuryCol.setAttribute('height', '18');
      mercuryCol.setAttribute('y', '150');
      gaugeLabel.textContent = '— °C';
      return;
    }
    const clamped = Math.max(-40, Math.min(120, celsius));
    const ratio = (clamped - (-40)) / (120 - (-40));
    const maxHeight = 150;
    const height = 18 + ratio * (maxHeight - 18);
    const y = 168 - height;
    mercuryCol.setAttribute('height', height.toFixed(1));
    mercuryCol.setAttribute('y', y.toFixed(1));

    let color;
    if (celsius <= 0) color = '#4fa3d1';
    else if (celsius >= 45) color = '#e2683f';
    else {
      const t = celsius / 45;
      color = mixColor('#4fa3d1', '#e2683f', t);
    }
    mercuryCol.setAttribute('fill', color);
    mercuryBulb.setAttribute('fill', color);
    gaugeLabel.textContent = fmt(celsius) + ' °C';
  }

  function mixColor(hex1, hex2, t){
    const c1 = hexToRgb(hex1);
    const c2 = hexToRgb(hex2);
    const r = Math.round(c1.r + (c2.r - c1.r) * t);
    const g = Math.round(c1.g + (c2.g - c1.g) * t);
    const b = Math.round(c1.b + (c2.b - c1.b) * t);
    return `rgb(${r},${g},${b})`;
  }

  function hexToRgb(hex){
    const v = parseInt(hex.slice(1), 16);
    return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
  }

  function getSelectedUnit(){
    return document.querySelector('input[name="unit"]:checked').value;
  }

  function unitLabel(unit){
    if (unit === 'C') return '°C';
    if (unit === 'F') return '°F';
    return 'K';
  }

  function runConversion(){
    const raw = tempInput.value.trim();

    if (raw === ''){
      hideError();
      clearResults();
      return;
    }

    const numeric = /^-?\d*\.?\d+$/;
    if (!numeric.test(raw)){
      showError('That is not a valid number. Enter digits only, with an optional minus sign or decimal point.');
      return;
    }

    const value = parseFloat(raw);
    const unit = getSelectedUnit();
    const celsius = toCelsius(value, unit);

    const absZeroLimit = unit === 'C' ? ABS_ZERO_C : unit === 'F' ? ABS_ZERO_F : ABS_ZERO_K;
    const belowAbsZero = unit === 'K' ? value < absZeroLimit : value < absZeroLimit - 0.001;

    if (belowAbsZero){
      showError(`That is below absolute zero (${fmt(absZeroLimit)} ${unitLabel(unit)}), the coldest temperature physically possible. Enter a value at or above this limit.`);
      return;
    }

    hideError();
    const result = fromCelsius(celsius);

    valC.textContent = fmt(result.c) + ' °C';
    valF.textContent = fmt(result.f) + ' °F';
    valK.textContent = fmt(result.k) + ' K';
    [valC, valF, valK].forEach(el => el.classList.remove('empty'));

    [cardC, cardF, cardK].forEach(c => c.classList.remove('active'));
    if (unit === 'C') cardC.classList.add('active');
    if (unit === 'F') cardF.classList.add('active');
    if (unit === 'K') cardK.classList.add('active');

    setThermometer(celsius);
  }

  tempInput.addEventListener('input', runConversion);
  document.querySelectorAll('input[name="unit"]').forEach(r => r.addEventListener('change', runConversion));
  convertBtn.addEventListener('click', runConversion);
  tempInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') runConversion();
  });

  clearResults();
</script>

</body>
</html>
